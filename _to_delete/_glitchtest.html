<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{margin:0;background:#000}</style></head><body><section class="galeria" id="galeria" aria-label="Archivo histórico del Fenómeno del Niño">
      <style>
        .galeria{ position:relative; background:#000; color:#fff; }
        .gal-track{ height:640vh; }                 /* ~80vh de scroll por foto (8 fotos) */
        .gal-sticky{ position:sticky; top:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        .gal-header{ flex:0 0 auto; text-align:center; padding:46px 20px 6px; }
        .gal-title{ font-family:'Monoglyphic Bold','Helvetica Neue',Arial,sans-serif; font-weight:700;
          font-size:clamp(1.8rem,3.2vw,2.5rem); line-height:1.1; margin:0 0 8px; color:#fff; }
        .gal-sub{ font-family:'Monoglyphic Bold','Helvetica Neue',Arial,sans-serif; font-weight:700;
          font-size:clamp(1rem,1.6vw,1.35rem); line-height:1.25; margin:0; color:#fff; }
        .gal-chev{ margin:18px auto 0; width:40px; height:40px; border:1px solid rgba(255,255,255,.5);
          display:flex; align-items:center; justify-content:center; border-radius:2px; }
        .gal-chev svg{ width:22px; height:22px; stroke:#fff; }
        .gal-stage{ position:relative; flex:1 1 auto; width:100%; min-height:0; }
        .gal-canvas{ position:absolute; inset:0; width:100%; height:100%; display:none; z-index:1; }
        .gal-slide{ position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; padding:14px 24px 26px; opacity:0;
          will-change:opacity; pointer-events:none; z-index:2; }
        .gal-slide:first-child{ opacity:1; }
        .gal-slide img{ display:block; width:auto; height:auto; max-width:min(1120px,100%);
          max-height:calc(100% - 44px); object-fit:contain; box-shadow:0 10px 40px rgba(0,0,0,.5); }
        .gal-slide figcaption{ margin-top:14px; font-family:system-ui,-apple-system,Arial,sans-serif;
          font-size:.78rem; letter-spacing:.05em; color:#b8b8b8; text-align:center; }
        /* Modo glitch (desktop): el canvas pinta las fotos y la transición; las <img> se ocultan
           pero siguen cargando para alimentar el canvas. Los créditos quedan por encima. */
        .gal-stage.glitch-on .gal-canvas{ display:block; }
        .gal-stage.glitch-on .gal-slide img{ display:none; }
        .gal-stage.glitch-on .gal-slide{ justify-content:flex-end; padding:14px 24px 30px; }
        @media (max-width:720px){
          /* Modo glitch en MÓVIL: mismo pin + canvas + transición que en desktop,
             con cabecera compacta y algo menos de scroll por foto. */
          .galeria.glitch-mode .gal-track{ height:520vh; }
          .gal-header{ padding:30px 16px 12px; }
          .gal-title{ font-size:1.5rem; }
          .gal-sub{ font-size:.95rem; }
          .galeria.glitch-mode .gal-slide figcaption{ font-size:.72rem; }
          /* Fallback (prefers-reduced-motion / sin glitch): fotos apiladas estáticas. */
          .galeria:not(.glitch-mode) .gal-track{ height:auto; }
          .galeria:not(.glitch-mode) .gal-sticky{ position:static; height:auto; display:block; overflow:visible; }
          .galeria:not(.glitch-mode) .gal-chev{ display:none; }
          .galeria:not(.glitch-mode) .gal-stage{ position:static; height:auto; }
          .galeria:not(.glitch-mode) .gal-canvas{ display:none !important; }
          .galeria:not(.glitch-mode) .gal-slide{ position:static; inset:auto; opacity:1 !important; transform:none !important;
            padding:0 12px 30px; pointer-events:auto; justify-content:flex-start; }
          .galeria:not(.glitch-mode) .gal-slide img{ display:block !important; width:100%; height:auto; max-width:100%; max-height:none;
            box-shadow:0 8px 26px rgba(0,0,0,.5); }
          .galeria:not(.glitch-mode) .gal-slide figcaption{ margin-top:11px; }
        }
        @media (prefers-reduced-motion:reduce){ .gal-slide{ transition:none; } }
      </style>
      <div class="gal-track">
        <div class="gal-sticky">
          <div class="gal-header">
            <h2 class="gal-title">El Niño, 40 años en imágenes</h2>
            <p class="gal-sub">Así se vivieron sus impactos en el Perú</p>
            <div class="gal-chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
          <div class="gal-stage">
          <figure class="gal-slide">
            <img src="1.jpg" alt="Archivo histórico del Fenómeno del Niño — foto 1" loading="eager" />
            <figcaption>17 de abril de 1983. Foto: Archivo El Comercio</figcaption>
          </figure>
<figure class="gal-slide">
            <img src="2.jpg" alt="Archivo histórico del Fenómeno del Niño — foto 2" loading="lazy" />
            <figcaption>Carretera Central 1998. Foto: Verónica Salem</figcaption>
          </figure>
<figure class="gal-slide">
            <img src="3.jpg" alt="Archivo histórico del Fenómeno del Niño — foto 3" loading="lazy" />
            <figcaption>1998. Foto: Yayo López</figcaption>
          </figure>
          </div>
        </div>
      </div>
      <script>
      (function(){
        var sec=document.getElementById('galeria'); if(!sec) return;
        var stage=sec.querySelector('.gal-stage');
        var slides=[].slice.call(sec.querySelectorAll('.gal-slide'));
        var N=slides.length; if(!N) return;
        var domImgs=slides.map(function(s){ return s.querySelector('img'); });
        // Imágenes dedicadas y precargadas para el canvas (no dependen de loading=lazy)
        var imgs=domImgs.map(function(im){ var x=new Image(); if(im){ x.src=im.getAttribute('src'); } return x; });

        var canvas=document.createElement('canvas'); canvas.className='gal-canvas';
        stage.appendChild(canvas);
        var ctx=canvas.getContext('2d');

        var mqDesktop=window.matchMedia('(min-width:721px)');
        var mqReduce =window.matchMedia('(prefers-reduced-motion:reduce)');
        var glitch=false, W=0, H=0, DPR=1;

        function resize(){
          if(!glitch) return;
          DPR=Math.min(2, window.devicePixelRatio||1);
          W=stage.clientWidth; H=stage.clientHeight;
          canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
          canvas.style.width=W+'px'; canvas.style.height=H+'px';
          ctx.setTransform(DPR,0,0,DPR,0,0);
        }
        function updateMode(){
          glitch = !mqReduce.matches;                 // glitch en todos los anchos (desktop y móvil)
          stage.classList.toggle('glitch-on', glitch);
          sec.classList.toggle('glitch-mode', glitch);
          if(glitch) resize();
          loop();
        }

        // Copias tintadas (canal rojo / cian) para la aberración cromática. Cacheadas.
        var tintCache={};
        function tinted(idx, mode){
          var key=idx+mode, c=tintCache[key]; if(c) return c;
          var im=imgs[idx]; if(!im || !im.naturalWidth) return null;
          var oc=document.createElement('canvas'); oc.width=im.naturalWidth; oc.height=im.naturalHeight;
          var o=oc.getContext('2d'); o.drawImage(im,0,0);
          o.globalCompositeOperation='multiply';
          o.fillStyle = (mode==='r') ? '#ff0000' : '#00ffff';
          o.fillRect(0,0,oc.width,oc.height);
          tintCache[key]=oc; return oc;
        }

        function containRect(im){
          var iw=(im&&im.naturalWidth)||16, ih=(im&&im.naturalHeight)||9;
          var small=W<600;
          var padX=small?10:24, padTop=small?10:14, padBot=small?40:52;
          var availW=Math.min(W-padX*2, 1120), availH=H-padTop-padBot;
          var scale=Math.min(availW/iw, availH/ih);
          var dw=iw*scale, dh=ih*scale;
          return { dx:(W-dw)/2, dy:padTop+(availH-dh)/2, dw:dw, dh:dh };
        }
        function progress(){
          var r=sec.getBoundingClientRect();
          var total=sec.offsetHeight-window.innerHeight;
          return total>0 ? Math.min(1,Math.max(0,(-r.top)/total)) : 0;
        }

        var seed=1, lastSeedT=0;
        function rnd(n){ var x=Math.sin(seed*12.9898 + n*78.233)*43758.5453; return x-Math.floor(x); }

        function drawGlitch(i,f,g){
          if(g<0.02) return;
          var cur=imgs[i], nxt=imgs[i+1];
          var rc=containRect(cur), rn=containRect(nxt);
          // 1) desplazamiento de bandas horizontales
          var bands=Math.floor(3+g*10), y=0;
          for(var b=0;b<bands;b++){
            var bh=(H/bands)*(0.5+rnd(b)*1.2); if(y+bh>H) bh=H-y;
            var useNext = rnd(b+100) < (f*0.7+0.15);
            var im=useNext?nxt:cur, r=useNext?rn:rc;
            var dx=(rnd(b+300)-0.5)*g*W*0.05;
            if(rnd(b+200)>0.90) dx += (rnd(b+7)-0.5)*W*0.11*g;
            ctx.save(); ctx.beginPath(); ctx.rect(0,y,W,bh+0.6); ctx.clip();
            if(im&&im.naturalWidth) ctx.drawImage(im, r.dx+dx, r.dy, r.dw, r.dh);
            ctx.restore();
            y+=bh; if(y>=H) break;
          }
          // 2) aberración cromática RGB
          var ca=g*W*0.006;
          if(ca>0.5){
            var domIdx=(f<0.5)?i:i+1, dr=(f<0.5)?rc:rn;
            var rC=tinted(domIdx,'r'), cC=tinted(domIdx,'c');
            if(rC&&cC){
              ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.38*g;
              ctx.drawImage(rC, dr.dx+ca, dr.dy, dr.dw, dr.dh);
              ctx.drawImage(cC, dr.dx-ca, dr.dy, dr.dw, dr.dh);
              ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
            }
          }
          // 3) scanlines / ruido
          var lines=Math.floor(g*4);
          for(var l=0;l<lines;l++){
            var ly=rnd(l+400)*H, lh=1+rnd(l+500)*2;
            ctx.fillStyle = (rnd(l+600)>0.6) ? 'rgba(60,180,165,'+(0.10+0.2*g)+')'
                                             : 'rgba(0,0,0,'+(0.14+0.22*g)+')';
            ctx.fillRect(0,ly,W,lh);
          }
          // 4) flash ocasional (muy esporádico)
          if(rnd(999)>0.965){ ctx.fillStyle='rgba(255,255,255,'+(0.03+0.07*g)+')'; ctx.fillRect(0,0,W,H); }
        }

        var raf=null;
        function draw(t){
          raf=null;
          var prog=progress(), pos=prog*(N-1);
          var i=Math.min(N-1, Math.floor(pos)), f=pos-i;
          // La transición (crossfade + glitch) ocurre SOLO en el tramo final de cada segmento,
          // para dejar ver la foto limpia la mayor parte del scroll y que el glitch sea rápido.
          var T=0.34;                              // ancho del tramo de transición (fracción del segmento)
          var tf = (f<=(1-T)) ? 0 : (f-(1-T))/T;   // 0..1 dentro de la transición
          // Créditos: se mantiene el de la foto actual y solo se cruza rápido en la transición
          // (evita que se vean dos créditos solapados a la vez).
          for(var k=0;k<N;k++) slides[k].style.opacity='0';
          if(tf<0.5 || i+1>=N) slides[i].style.opacity='1';   // cambio seco en mitad del glitch
          else slides[i+1].style.opacity='1';                  // (queda enmascarado por el efecto)
          if(!glitch) return;                 // reduced-motion: CSS muestra las <img>
          var cur=imgs[i];
          if(!cur || !cur.naturalWidth){ raf=requestAnimationFrame(draw); return; } // aún cargando: conserva el frame previo
          ctx.clearRect(0,0,W,H);
          var rc=containRect(cur); ctx.drawImage(cur,rc.dx,rc.dy,rc.dw,rc.dh);
          var hasNext = tf>0.0001 && i+1<N && imgs[i+1] && imgs[i+1].naturalWidth;
          if(hasNext){
            var nxt=imgs[i+1], rn=containRect(nxt);
            ctx.globalAlpha=tf; ctx.drawImage(nxt,rn.dx,rn.dy,rn.dw,rn.dh); ctx.globalAlpha=1;
            if(t-lastSeedT>55){ seed=Math.random()*1e9; lastSeedT=t; }
            drawGlitch(i,tf,Math.sin(Math.PI*tf)*0.8);
          }
          raf=requestAnimationFrame(draw);   // sigue animando mientras la sección esté visible
        }
        function loop(){ if(!raf) raf=requestAnimationFrame(draw); }

        var io=new IntersectionObserver(function(e){
          if(e[0].isIntersecting) loop();
          else if(raf){ cancelAnimationFrame(raf); raf=null; }
        }, {threshold:0});
        io.observe(sec);

        window.addEventListener('scroll', loop, {passive:true});
        window.addEventListener('resize', function(){ resize(); loop(); });
        if(mqDesktop.addEventListener){ mqDesktop.addEventListener('change',updateMode); mqReduce.addEventListener('change',updateMode); }
        else if(mqDesktop.addListener){ mqDesktop.addListener(updateMode); mqReduce.addListener(updateMode); }
        imgs.forEach(function(im){ if(im) im.addEventListener('load', loop); });

        updateMode();
      })();
      </script>
    </section></body></html>
