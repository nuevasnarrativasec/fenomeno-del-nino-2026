<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Niño y tú — ¿Cómo te afectaría?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #04080f;
      color: #e8e0d5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── PANEL DE IMPACTO PERSONAL ── */
    #impact-panel {
      position: relative;
      width: 340px;
      max-width: 100%;
      max-height: calc(100vh - 48px);
      background: rgba(4, 8, 15, 0.96);
      border: 1px solid #1e2a3e;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    }

    .ip-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 15px 17px 13px;
      border-bottom: 1px solid #141c2e;
      flex-shrink: 0;
    }

    .ip-eyebrow {
      font-family: sans-serif;
      font-size: 0.60rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #e09070;
      margin-bottom: 2px;
    }

    .ip-panel-title { font-size: 0.95rem; color: #f0e8df; }

    .ip-toggle {
      background: none;
      border: none;
      color: #3a4050;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .ip-toggle:hover { color: #f0e8df; }

    #ipBody {
      overflow-y: auto;
      padding: 14px 17px;
      flex: 1;
    }
    #ipBody::-webkit-scrollbar { width: 3px; }
    #ipBody::-webkit-scrollbar-thumb { background: #1e2a3e; border-radius: 2px; }

    .ip-intro {
      font-family: sans-serif;
      font-size: 0.74rem;
      color: #4a5568;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .ip-field { margin-bottom: 12px; }

    .ip-label {
      display: block;
      font-family: sans-serif;
      font-size: 0.64rem;
      color: #3a4a5a;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 5px;
    }

    .ip-input, .ip-select {
      width: 100%;
      background: #060d18;
      border: 1px solid #1a2436;
      border-radius: 5px;
      padding: 8px 9px;
      font-family: sans-serif;
      font-size: 0.78rem;
      color: #b0a8a0;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .ip-input:focus, .ip-select:focus { border-color: #2a4070; }
    .ip-input::placeholder { color: #1e2a3a; }

    .ip-radio-group { display: flex; gap: 14px; }
    .ip-radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: sans-serif;
      font-size: 0.74rem;
      color: #6a7080;
      cursor: pointer;
    }
    .ip-radio-input { accent-color: #e05c2a; }

    .ip-submit {
      width: 100%;
      background: rgba(26, 58, 106, 0.5);
      border: 1px solid #2a4a7a;
      border-radius: 6px;
      padding: 10px;
      font-family: sans-serif;
      font-size: 0.78rem;
      color: #8ab0e0;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .ip-submit:hover { background: rgba(30,74,136,0.7); color: #f0e8df; border-color: #3a6aaa; }

    .ip-error { font-family: sans-serif; font-size: 0.67rem; color: #e05c2a; margin-top: 5px; min-height: 14px; }

    /* Resultado */
    .ip-result-greeting { font-size: 0.95rem; color: #f0e8df; margin-bottom: 8px; }
    .ip-result-context  { font-family: sans-serif; font-size: 0.74rem; color: #6a7880; line-height: 1.55; }
    .ip-result-body     { font-family: sans-serif; font-size: 0.77rem; color: #9a9888; line-height: 1.6; }
    .ip-result-age      { font-family: sans-serif; font-size: 0.72rem; color: #5a6070; line-height: 1.55; font-style: italic; }
    .ip-divider         { height: 1px; background: #141c2e; margin: 11px 0; }

    .ip-back {
      background: none;
      border: 1px solid #1e2a3e;
      border-radius: 4px;
      padding: 6px 11px;
      font-family: sans-serif;
      font-size: 0.67rem;
      color: #4a5568;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
    }
    .ip-back:hover { color: #f0e8df; border-color: #3a4a6a; }
  </style>
</head>
<body>

  <!-- Panel: ¿Cómo te afecta El Niño? -->
  <div id="impact-panel">
    <div class="ip-header">
      <div>
        <div class="ip-eyebrow">El Niño y tú</div>
        <div class="ip-panel-title">¿Cómo te afectaría?</div>
      </div>
      <button class="ip-toggle" id="ipToggle" title="Colapsar">−</button>
    </div>
    <div id="ipBody">

      <div id="ipForm">
        <p class="ip-intro">Cuéntanos sobre ti y te mostramos cómo El Niño podría impactar tu vida directamente.</p>

        <div class="ip-field">
          <label class="ip-label" for="ipName">Tu nombre</label>
          <input type="text" id="ipName" class="ip-input" placeholder="Escribe tu nombre" />
        </div>

        <div class="ip-field">
          <label class="ip-label">Género</label>
          <div class="ip-radio-group">
            <label class="ip-radio-label"><input type="radio" name="gender" value="hombre" class="ip-radio-input" checked /><span>Hombre</span></label>
            <label class="ip-radio-label"><input type="radio" name="gender" value="mujer"  class="ip-radio-input" /><span>Mujer</span></label>
            <label class="ip-radio-label"><input type="radio" name="gender" value="otro"   class="ip-radio-input" /><span>Otro</span></label>
          </div>
        </div>

        <div class="ip-field">
          <label class="ip-label" for="ipAge">Edad</label>
          <select id="ipAge" class="ip-select">
            <option value="">Selecciona...</option>
            <option value="15-20">15–20 años</option>
            <option value="21-30">21–30 años</option>
            <option value="31-40">31–40 años</option>
            <option value="41-55">41–55 años</option>
            <option value="56+">56 o más años</option>
          </select>
        </div>

        <div class="ip-field">
          <label class="ip-label" for="ipProfession">Profesión</label>
          <select id="ipProfession" class="ip-select">
            <option value="">Selecciona...</option>
          </select>
        </div>

        <div class="ip-field">
          <label class="ip-label" for="ipRegion">Tu región</label>
          <select id="ipRegion" class="ip-select">
            <option value="">Selecciona...</option>
          </select>
        </div>

        <button id="ipSubmit" class="ip-submit">Ver mi impacto →</button>
        <div class="ip-error" id="ipError"></div>
      </div>

      <div id="ipResult" style="display:none">
        <div class="ip-result-greeting" id="ipResultGreeting"></div>
        <div class="ip-result-context"  id="ipResultContext"></div>
        <div class="ip-divider"></div>
        <div class="ip-result-body"    id="ipResultBody"></div>
        <div class="ip-divider"></div>
        <div class="ip-result-age"     id="ipResultAge"></div>
        <button class="ip-back" id="ipBack">← Cambiar datos</button>
      </div>

    </div>
  </div>

<script>

  { region:'Arequipa',      tipo:'neutral', contexto:'Arequipa tiene un impacto moderado: la costa recibe algo más de calor mientras la sierra muestra variabilidad hídrica. El río Chili puede presentar crecidas puntuales sin llegar a ser catastróficas.' },

const AGE_NOTES_DEFAULT = {
  '15-20': 'A tu edad, el Niño puede interrumpir tus estudios, pero también es una oportunidad única para documentar sus efectos en tu comunidad y construir experiencia real en un tema que marcará tu generación.',
  '21-30': 'En la etapa de inicio profesional, la flexibilidad es tu mayor ventaja. Adaptar tu trabajo a modalidad remota o diversificar hacia sectores menos expuestos al clima puede proteger tu carrera durante el fenómeno.',

  '56+': 'En esta etapa es importante priorizar la salud y la red de apoyo. Ante eventos extremos, no subestimes las señales de alerta y mantén contacto frecuente con familiares o vecinos de confianza.',

// ─── ESTADO (se sobrescribe al cargar el Sheet) ──────────────────────────────
let sheetRegions     = null;
let sheetProfessions = null;
let sheetAges        = null;

// ─── PARSEAR CSV SIMPLE ──────────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

// ─── CARGAR GOOGLE SHEETS ────────────────────────────────────────────────────
async function loadSheetData() {
  if (!SHEET_ID) return;
  const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
  try {
    const [rRes, pRes, aRes] = await Promise.all([
      fetch(base + 'regiones'),
      fetch(base + 'profesiones'),
      fetch(base + 'edades'),
    ]);
    if (!rRes.ok || !pRes.ok || !aRes.ok) throw new Error('Sheet no accesible');
    const [rText, pText, aText] = await Promise.all([rRes.text(), pRes.text(), aRes.text()]);

    const rRows = parseCSV(rText).slice(1);
    sheetRegions = rRows.map(r => ({ region: r[0], tipo: r[1], contexto: r[2] })).filter(r => r.region);

    const pRows = parseCSV(pText).slice(1);
    sheetProfessions = pRows.filter(r => r[0]);

    const aRows = parseCSV(aText).slice(1);
    sheetAges = aRows.filter(r => r[0]);

    console.log(`✓ Textos cargados desde Google Sheets: ${sheetRegions.length} regiones, ${sheetProfessions.length} profesiones`);
  } catch (e) {
    console.warn('⚠ Google Sheet no disponible, usando textos de respaldo:', e.message);
  }
}

// ─── LÓGICA DE IMPACTO ───────────────────────────────────────────────────────
function getRegionData(regionName) {
  const list = sheetRegions || PERU_REGIONS_DEFAULT;
  return list.find(r => r.region === regionName) || { tipo: 'neutral', contexto: 'En tu región, El Niño genera variaciones climáticas que afectan la disponibilidad de agua, la producción agrícola y los servicios básicos.' };
}

function getProfImpact(profession, tipo) {
  if (sheetProfessions) {
    const row = sheetProfessions.find(r => r[0] === profession);
    if (row) {
      const idx = tipo === 'warm' ? 1 : tipo === 'cold' ? 2 : 3;
      return row[idx] || '';
    }
  }
  return (PROF_IMPACTS_DEFAULT[profession] || PROF_IMPACTS_DEFAULT['Otro'])[tipo];
}

function getAgeNote(ageRange) {
  if (sheetAges) {
    const row = sheetAges.find(r => r[0] === ageRange);
    if (row) return row[1] || '';
  }
  return AGE_NOTES_DEFAULT[ageRange] || '';
}

function generatePersonalImpact({ name, ageRange, profession, region }) {
  const rd       = getRegionData(region);
  const profText = getProfImpact(profession, rd.tipo);
  const ageText  = getAgeNote(ageRange);
  return { saludo: `${name}, tu panorama:`, context: rd.contexto, profText, ageText };
}

// ─── INICIALIZAR PANEL ───────────────────────────────────────────────────────
function initImpactPanel() {
  const profSel  = document.getElementById('ipProfession');
  const profList = sheetProfessions ? sheetProfessions.map(r => r[0]) : PROFESSIONS_DEFAULT;
  profList.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    profSel.appendChild(o);
  });

  const regionSel  = document.getElementById('ipRegion');
  const regionList = sheetRegions || PERU_REGIONS_DEFAULT;
  regionList.forEach(r => {
    const o = document.createElement('option');
    o.value = r.region; o.textContent = r.region;
    regionSel.appendChild(o);
  });

  document.getElementById('ipToggle').addEventListener('click', function () {
    const body   = document.getElementById('ipBody');
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? '' : 'none';
    this.textContent   = hidden ? '−' : '+';
  });

  document.getElementById('ipSubmit').addEventListener('click', () => {
    const name       = document.getElementById('ipName').value.trim();
    const ageRange   = document.getElementById('ipAge').value;
    const profession = document.getElementById('ipProfession').value;
    const region     = document.getElementById('ipRegion').value;
    const errEl      = document.getElementById('ipError');

    if (!name)       { errEl.textContent = 'Por favor escribe tu nombre.';  return; }
    if (!ageRange)   { errEl.textContent = 'Selecciona tu rango de edad.';  return; }
    if (!profession) { errEl.textContent = 'Selecciona tu profesión.';      return; }
    if (!region)     { errEl.textContent = 'Selecciona tu región.';         return; }
    errEl.textContent = '';

    const { saludo, context, profText, ageText } = generatePersonalImpact({ name, ageRange, profession, region });

    document.getElementById('ipResultGreeting').textContent = saludo;
    document.getElementById('ipResultContext').textContent  = context;
    document.getElementById('ipResultBody').textContent     = profText;
    document.getElementById('ipResultAge').textContent      = ageText;

    document.getElementById('ipForm').style.display   = 'none';
    document.getElementById('ipResult').style.display = '';
  });

  document.getElementById('ipBack').addEventListener('click', () => {
    document.getElementById('ipForm').style.display   = '';
    document.getElementById('ipResult').style.display = 'none';
    document.getElementById('ipError').textContent    = '';
  });
}

loadSheetData().then(() => initImpactPanel());
</script>
