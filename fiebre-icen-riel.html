  html,body{ height:100%; background:transparent; }

  #rib{ position:absolute; left:0; top:0; width:76px; height:100%; }
  .yr{ position:absolute; left:3px; transform:translateY(-50%);
       font:700 10px 'Monoglyphic Bold', system-ui, sans-serif; letter-spacing:.03em;
       color:#fff; background:#111; padding:2px 6px; border-radius:4px; white-space:nowrap; }
  .pk{ position:absolute; transform:translateY(-50%); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .pk .dot{ width:9px; height:9px; border-radius:50%; background:#fff; border:2.4px solid #ee3d2f; box-sizing:border-box; flex:0 0 auto; }
  .pk .lab{ font:700 11px 'Monoglyphic Bold', system-ui, sans-serif; color:#d92316; }

const PEAK_IDX = [41, 147, 432, 446, 522];
const yr = i => 1980 + Math.floor(i/12);

(function(){
  const N = ICEN.length;
  const VW = 76;                 // ancho del viewBox = ancho del riel (sin distorsión horizontal)
  const VH = N - 1;              // alto del viewBox en "meses" (se estira a la altura real)
  const centerX = 44;            // eje 0
  const k = 6.6;                 // px(viewBox) por unidad de anomalía
  const X = v => centerX + v*k;

  const svg = document.getElementById('rib');
  svg.setAttribute('viewBox', '0 0 '+VW+' '+VH);
  const NS='http://www.w3.org/2000/svg';
  function el(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }

  const defs = el('defs',{});
  defs.innerHTML =
    '<linearGradient id="gW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7c9c2"/><stop offset="0.55" stop-color="#ee5a48"/><stop offset="1" stop-color="#d92316"/></linearGradient>'+
    '<linearGradient id="gC" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#cfeaf7"/><stop offset="0.6" stop-color="#37a8e0"/><stop offset="1" stop-color="#1f8ecb"/></linearGradient>'+
    '<clipPath id="cR"><rect x="'+centerX+'" y="-4" width="'+(VW-centerX)+'" height="'+(VH+8)+'"/></clipPath>'+
    '<clipPath id="cL"><rect x="0" y="-4" width="'+centerX+'" height="'+(VH+8)+'"/></clipPath>';
  svg.appendChild(defs);

  let d = 'M '+X(ICEN[0])+' 0';
  for(let i=1;i<N;i++){ d += ' L '+X(ICEN[i])+' '+i; }
  d += ' L '+centerX+' '+(N-1)+' L '+centerX+' 0 Z';

  svg.appendChild(el('path',{ d:d, fill:'url(#gW)', 'clip-path':'url(#cR)' }));
  svg.appendChild(el('path',{ d:d, fill:'url(#gC)', 'clip-path':'url(#cL)' }));
  svg.appendChild(el('line',{ x1:centerX, y1:0, x2:centerX, y2:(N-1), stroke:'rgba(0,0,0,.25)', 'stroke-width':0.4, 'vector-effect':'non-scaling-stroke' }));

  const stage = document.getElementById('stage');
  // etiquetas de década (posición por %)
  [1980,1990,2000,2010,2020,2026].forEach(function(Y){
    let idx=(Y-1980)*12; if(idx>N-1) idx=N-1;
    const t=document.createElement('div'); t.className='yr'; t.textContent=Y;
    t.style.top = (idx/(N-1)*100)+'%';
    stage.appendChild(t);
  });
  // picos (dot + año), posición por %
  PEAK_IDX.forEach(function(i){
    const w=document.createElement('div'); w.className='pk';
    w.style.top=(i/(N-1)*100)+'%';
    w.style.left=X(ICEN[i])+'px';
    w.innerHTML='<span class="dot"></span><span class="lab">'+yr(i)+'</span>';
    stage.appendChild(w);
  });
})();
