  /* años-pico con desglose */
  .pk-block{ position:absolute; left:56px; width:128px; transform:translateY(-50%); }
  .pk-yr{ display:inline-block; font:700 15px 'Monoglyphic Bold', system-ui, sans-serif;
          color:#fff; background:#111; padding:3px 11px; border-radius:5px; letter-spacing:.02em; }
  .pk-desc{ margin-top:6px; }
  .pk-desc .m{ display:block; font:700 10.5px 'Monoglyphic Bold', system-ui, sans-serif; color:#c0281b; }
  .pk-desc .d{ display:block; margin-top:2px; font:400 10px system-ui, -apple-system, sans-serif; color:#565656; line-height:1.35; }

    -0.5, -0.51, -0.06, 0.42, 0.96, 1.34, 1.98, 2.66, 3.29
];
const PEAK_IDX = [41, 215, 432, 446, 522];
const yr = i => 1980 + Math.floor(i/12);

(function(){
  const N = ICEN.length;
  const VW = 76;                 // ancho del viewBox = ancho del riel
  const VH = N - 1;              // alto en "meses" (se estira a la altura real)
  const MIN = Math.min.apply(null, ICEN);     // mes más frío (~ -1.66)
  const MAX = Math.max.apply(null, ICEN);     // mes más cálido (~ 4.32)
  const scale = 9;               // px(viewBox) por unidad de anomalía (riel delgado)
  const cx = v => (v - MIN) * scale;          // x anclada al borde izquierdo
  const maxC = cx(MAX);          // extensión máxima hacia la derecha
  const zeroX = cx(0);           // línea neutra (ICEN = 0)

  const svg = document.getElementById('rib');
  svg.setAttribute('viewBox', '0 0 '+VW+' '+VH);
  const NS='http://www.w3.org/2000/svg';
  function el(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }

  // corridas de meses fríos (ICEN < 0) -> rects de recorte para el azul
  let coldRects = '', runStart = null;
  for (let i=0;i<=N;i++){
    const cold = (i<N) && (ICEN[i] < 0);
    if (cold && runStart===null) runStart = i;
    if (!cold && runStart!==null){
      coldRects += '<rect x="-2" y="'+(runStart-0.5)+'" width="'+(VW+4)+'" height="'+((i-1)-runStart+1)+'"/>';
      runStart = null;
    }
  }

  const defs = el('defs',{});
  defs.innerHTML =
    '<linearGradient id="gW" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="'+maxC+'" y2="0">'+
      '<stop offset="0" stop-color="#f6bdb4"/><stop offset="0.5" stop-color="#ee5a48"/><stop offset="1" stop-color="#d31d12"/></linearGradient>'+
    '<linearGradient id="gC" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="'+maxC+'" y2="0">'+
      '<stop offset="0" stop-color="#1f8ecb"/><stop offset="0.4" stop-color="#37a8e0"/><stop offset="1" stop-color="#bfe3f5"/></linearGradient>'+
    '<clipPath id="cCold">'+coldRects+'</clipPath>';
  svg.appendChild(defs);

  // área anclada al borde izquierdo (x=0) hasta la curva (a la derecha)
  let d = 'M 0 0 L '+cx(ICEN[0]).toFixed(2)+' 0';
  for(let i=1;i<N;i++){ d += ' L '+cx(ICEN[i]).toFixed(2)+' '+i; }
  d += ' L 0 '+(N-1)+' Z';

  svg.appendChild(el('path',{ d:d, fill:'url(#gW)' }));                                  // cálido (base)
  svg.appendChild(el('path',{ d:d, fill:'url(#gC)', 'clip-path':'url(#cCold)' }));       // frío encima
  // línea neutra (ICEN = 0), sutil
  svg.appendChild(el('line',{ x1:zeroX, y1:0, x2:zeroX, y2:VH, stroke:'rgba(255,255,255,.55)', 'stroke-width':0.6, 'stroke-dasharray':'2 3', 'vector-effect':'non-scaling-stroke' }));

  const stage = document.getElementById('stage');
  // Año de inicio (arriba, completo, sin cortarse)
  const yStart = document.createElement('div'); yStart.className='yr'; yStart.textContent='1980';
  yStart.style.top='5px'; stage.appendChild(yStart);
  // Año final (abajo, anclado por su base para no montarse sobre el footer)
  const yEnd = document.createElement('div'); yEnd.className='yr'; yEnd.textContent='2026';
  yEnd.style.bottom='7px'; stage.appendChild(yEnd);

  // Años-pico con desglose (texto pequeño). El mes y la anomalía salen de la serie;
  // el descriptor del evento es editable por la redacción.
  const PEAKS = [
    { i:41,  m:'Jun. 1983 · +4,3 °C', d:'El Niño extraordinario, el más intenso de la serie.' },
    { i:215, m:'Dic. 1997 · +4,1 °C', d:'El Niño extraordinario 1997-98; inundaciones catastróficas en la costa norte.' },
    { i:432, m:'Ene. 2016 · +1,8 °C', d:'El Niño muy fuerte a escala global; moderado en la costa.' },
    { i:446, m:'Mar. 2017 · +1,3 °C', d:'El Niño Costero: huaicos e inundaciones en la costa norte.' },
    { i:522, m:'Jul. 2023 · +2,9 °C', d:'El Niño Costero: lluvias, inundaciones y brote de dengue.' }
  ];
  PEAKS.forEach(function(pk){
    const b=document.createElement('div'); b.className='pk-block';
    b.style.top=(pk.i/(N-1)*100)+'%';
    b.innerHTML='<span class="pk-yr">'+yr(pk.i)+'</span>'+
                '<div class="pk-desc"><span class="m">'+pk.m+'</span><span class="d">'+pk.d+'</span></div>';
    stage.appendChild(b);
  });
})();
